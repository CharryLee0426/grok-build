name: Publish Grok Desktop 1.0 DMG

on:
  push:
    branches:
      - automation/publish-desktop-v1-dmg
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-v1-dmg-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish arm64 DMG
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Apple silicon and Xcode
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version

      - name: Install DotSlash
        run: |
          if ! command -v dotslash >/dev/null 2>&1; then
            cargo install dotslash --locked
          fi
          dotslash --help >/dev/null

      - name: Build and verify DMG
        run: |
          make dmg-desktop
          test -f desktop/macOS/dist/Grok-Desktop-1.0.0-arm64.dmg
          hdiutil verify desktop/macOS/dist/Grok-Desktop-1.0.0-arm64.dmg
          codesign --verify --deep --strict "desktop/macOS/dist/Grok Desktop.app"
          nm -m "desktop/macOS/dist/Grok Desktop.app/Contents/MacOS/GrokDesktop" | grep -q 'glassEffect'

      - name: Upload DMG to the v1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-v1.0.0 \
            desktop/macOS/dist/Grok-Desktop-1.0.0-arm64.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view desktop-v1.0.0 --repo "$GITHUB_REPOSITORY" --json url,assets

      - name: Record artifact digest
        run: |
          digest="$(shasum -a 256 desktop/macOS/dist/Grok-Desktop-1.0.0-arm64.dmg | awk '{print $1}')"
          size="$(stat -f '%z' desktop/macOS/dist/Grok-Desktop-1.0.0-arm64.dmg)"
          {
            echo "### Release artifact"
            echo
            echo "- SHA-256: \`$digest\`"
            echo "- Size: \`$size\` bytes"
          } >> "$GITHUB_STEP_SUMMARY"
